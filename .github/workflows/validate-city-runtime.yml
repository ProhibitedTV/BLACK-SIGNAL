name: Validate BLACK SIGNAL authored city

on:
  pull_request:
    paths:
      - 'gameguru/Files/scriptbank/**'
      - 'gameguru/maps/BLACK SIGNAL - District 12.lst'
      - 'gameguru/buildplans/**'
      - 'docs/DISTRICT-12-AUTHORED-CITY.md'
      - 'docs/DISTRICT-12-BLOCK-01-HERO-JUNCTION.md'
      - 'docs/DISTRICT-12-STREET-FABRIC.md'
      - 'docs/GAMEGURU-MAX-FPM-FORMAT.md'
      - 'tools/*.ps1'
      - 'tools/*.bat'
      - 'tools/*.py'
      - 'tools/tests/**'
      - '.github/workflows/validate-city-runtime.yml'
  push:
    branches: [ main ]
    paths:
      - 'gameguru/Files/scriptbank/**'
      - 'gameguru/maps/BLACK SIGNAL - District 12.lst'
      - 'gameguru/buildplans/**'
      - 'docs/DISTRICT-12-AUTHORED-CITY.md'
      - 'docs/DISTRICT-12-BLOCK-01-HERO-JUNCTION.md'
      - 'docs/DISTRICT-12-STREET-FABRIC.md'
      - 'docs/GAMEGURU-MAX-FPM-FORMAT.md'
      - 'tools/*.ps1'
      - 'tools/*.bat'
      - 'tools/*.py'
      - 'tools/tests/**'
      - '.github/workflows/validate-city-runtime.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Lua compiler
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Syntax-check BLACK SIGNAL Lua
        shell: bash
        run: |
          set -euo pipefail
          find gameguru/Files/scriptbank/user/black_signal -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
          luac -p gameguru/Files/scriptbank/gameloop.lua

      - name: Syntax-check PowerShell tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            './tools/validate-repo.ps1',
            './tools/audit-district12-authored-kit.ps1',
            './tools/audit-cyberpunk-detail-assets.ps1',
            './tools/find-cyberpunk-curb-candidates.ps1',
            './tools/install-default-runtime-hook.ps1',
            './tools/deploy-gameguru-project.ps1',
            './tools/fix-game.ps1',
            './tools/show-district12-block01-plan.ps1',
            './tools/sync-district12-back.ps1',
            './tools/inspect-district12-fpm.ps1',
            './tools/create-district12-clone-test.ps1',
            './tools/create-district12-street-fabric.ps1',
            './tools/promote-district12-street-fabric.ps1',
            './tools/rebase-district12-on-cybercity.ps1',
            './tools/build-district12-city.ps1',
            './tools/build-district12-road-network.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax check failed: $script"
            }
            Write-Host "[PASS] PowerShell syntax: $script"
          }

      - name: Validate Python FPM tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/fpm_inspect.py \
            tools/fpm_clone_entity.py \
            tools/fpm_author_street_fabric.py \
            tools/fpm_author_street_fabric_compat.py \
            tools/fpm_author_city_mass.py \
            tools/fpm_author_road_network.py \
            tools/tests/test_fpm_inspect.py \
            tools/tests/test_fpm_clone_entity.py \
            tools/tests/test_fpm_author_street_fabric.py \
            tools/tests/test_fpm_street_fabric_quat_compat.py \
            tools/tests/test_fpm_author_city_mass.py \
            tools/tests/test_fpm_author_road_network.py
          python3 -m unittest discover -s tools/tests -p 'test_fpm_*.py' -v

      - name: Validate authored District 12 repository contract
        shell: pwsh
        run: ./tools/validate-repo.ps1 -GameGuruFiles /tmp/gameguru-not-installed

      - name: Audit authored Cyberpunk Streets kit coverage
        shell: pwsh
        run: ./tools/audit-district12-authored-kit.ps1

      - name: Validate Block 01 build manifest against current level dependencies
        shell: pwsh
        run: ./tools/show-district12-block01-plan.ps1

  windows-powershell-compat:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Parse project PowerShell with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            '.\tools\validate-repo.ps1',
            '.\tools\audit-district12-authored-kit.ps1',
            '.\tools\audit-cyberpunk-detail-assets.ps1',
            '.\tools\find-cyberpunk-curb-candidates.ps1',
            '.\tools\install-default-runtime-hook.ps1',
            '.\tools\deploy-gameguru-project.ps1',
            '.\tools\fix-game.ps1',
            '.\tools\show-district12-block01-plan.ps1',
            '.\tools\sync-district12-back.ps1',
            '.\tools\inspect-district12-fpm.ps1',
            '.\tools\create-district12-clone-test.ps1',
            '.\tools\create-district12-street-fabric.ps1',
            '.\tools\promote-district12-street-fabric.ps1',
            '.\tools\rebase-district12-on-cybercity.ps1',
            '.\tools\build-district12-city.ps1',
            '.\tools\build-district12-road-network.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "Windows PowerShell 5.1 syntax check failed: $script"
            }
            Write-Host "[PASS] Windows PowerShell 5.1 syntax: $script"
          }

      - name: Run FPM tooling unit tests on Windows
        shell: powershell
        run: |
          python -m py_compile .\tools\fpm_inspect.py .\tools\fpm_clone_entity.py .\tools\fpm_author_street_fabric.py .\tools\fpm_author_street_fabric_compat.py .\tools\fpm_author_city_mass.py .\tools\fpm_author_road_network.py .\tools\tests\test_fpm_inspect.py .\tools\tests\test_fpm_clone_entity.py .\tools\tests\test_fpm_author_street_fabric.py .\tools\tests\test_fpm_street_fabric_quat_compat.py .\tools\tests\test_fpm_author_city_mass.py .\tools\tests\test_fpm_author_road_network.py
          python -m unittest discover -s .\tools\tests -p test_fpm_*.py -v

      - name: Run Block 01 checklist under Windows PowerShell 5.1
        shell: powershell
        run: .\tools\show-district12-block01-plan.ps1
